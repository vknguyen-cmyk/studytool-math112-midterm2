.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{padding-block:34px 18px;display:grid;gap:6px}
h1{font-weight:700;font-size:clamp(26px,4.5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.controls{display:grid;gap:10px;padding-block:14px 6px}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:15px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.pill.star[aria-pressed="true"]{background:var(--star);border-color:var(--star)}
.count{margin-left:auto;color:var(--muted);font-size:15px}
main .wrap{padding-block:10px 70px;display:grid;gap:10px}
.week{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.goal{background:var(--card);border:1px solid var(--line);border-radius:10px}
.goal{border-left:5px solid var(--lvl,var(--line))}
.lv1,.lv2{--lvl:var(--m1)}.lv3{--lvl:var(--m3)}.lv4,.lv5{--lvl:var(--m5)}
.mini{letter-spacing:1px;color:var(--lvl)}.mini i{font-style:normal;color:var(--m0)}
.stars{display:flex;align-items:center;gap:2px;flex-wrap:wrap}.stars .lab{margin-right:8px}
.stars button{border:0;background:none;cursor:pointer;font-size:26px;line-height:1;padding:0 2px;color:var(--m0)}
.stars button.on{color:var(--lvl)}.stars button:hover{transform:scale(1.12)}
.stars .word{margin-left:10px;color:var(--muted);font-size:15px}
.ghead{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;border-radius:10px}
.ghead:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.gn{font-weight:700;color:var(--accent);min-width:2.4em}
.gt{min-width:0}
.gmeta{display:flex;gap:10px;margin-top:4px;font-size:14.5px;color:var(--muted);flex-wrap:wrap}
.gmeta .s{color:var(--star)}.gmeta .k{color:var(--good)}
.chev{color:var(--muted);transition:transform .15s}.goal.open .chev{transform:rotate(90deg)}
.gbody{border-top:1px solid var(--line);padding:12px 16px 18px;display:grid;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 13px;cursor:pointer;font-size:15.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab:disabled{opacity:.4;cursor:default}
.items{display:grid;gap:14px}
.item{display:grid;gap:6px}
.ihead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.ilabel{font-weight:700;font-size:15.5px}.ilabel span{font-weight:400;color:var(--muted)}
.pdflink{font-size:14.5px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.note{font-style:italic;color:var(--muted);font-size:15px;margin:0}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto}
.paper img{display:block;height:auto;width:min(var(--w),100%)}
.paper p{margin:0 0 8px}
.choices{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.choices li{display:flex;gap:10px;align-items:baseline}
.choices .b{flex:none;width:13px;height:13px;border:1.4px solid #555;transform:translateY(2px)}
.choices.radio .b{border-radius:50%}
.free{color:#666;font-style:italic;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.btn:focus-visible,.pill:focus-visible,.tab:focus-visible,.ghead:focus-visible,input:focus-visible,.pdflink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.6);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#pdfModal{z-index:30}
.sheet{background:var(--card);border-radius:12px;width:min(860px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid var(--line)}
.sheet header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header strong{margin-right:auto}
.scroll{overflow:auto;padding:14px;min-height:0}
#pdfCanvas{display:block;margin:0 auto;max-width:100%;height:auto;background:#fff}
.q{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.q p{margin:0 0 8px}
.choice{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.choice.right{border-color:var(--good);background:var(--good-soft)}.choice.wrong{border-color:#b4413a;background:color-mix(in srgb,#b4413a 14%,var(--bg))}
.explain{color:var(--muted);font-size:15.5px;margin-top:6px}
.muted{color:var(--muted)}
@media (max-width:560px){body{font-size:16px}.paper{padding:10px}.paper img{width:calc(var(--w) * .8);max-width:none}.ihead{flex-direction:column;gap:2px}.ghead{grid-template-columns:auto 1fr;gap:10px}.chev{display:none}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

<header><div class="wrap">
  <h1>Math 112 Midterm 2 Study Tool</h1>
  <p class="lede">Open a learning goal to see every lecture passage, homework problem, PCRQ, exit-ticket question and practice-exam problem that covers it.</p>
  <div class="controls">
    <input id="q" class="search" type="search" placeholder="Search goals and questions, e.g. supremum, polar form, squeeze" aria-label="Search">
    <div class="row" id="weeks"></div>
    <div class="row"><button class="pill star" id="fStar" aria-pressed="false">On a practice exam</button><button class="pill" id="fTodo" aria-pressed="false">Needs work (under 4 ★)</button><span class="count" id="count"></span></div>
  </div>
</div></header>

<main><div class="wrap" id="list"><p class="empty">Loading the learning goals…</p></div></main>

<div class="modal" id="pdfModal" hidden role="dialog" aria-modal="true" aria-labelledby="pdfTitle"><div class="sheet">
  <header><strong id="pdfTitle"></strong><button class="btn" id="pdfPrev">‹ Prev</button><span id="pdfPage" class="muted"></span><button class="btn" id="pdfNext">Next ›</button><button class="btn" id="pdfClose">Close</button></header>
  <div class="scroll"><p class="muted" id="pdfMsg"></p><canvas id="pdfCanvas"></canvas></div>
</div></div>
<div class="modal" id="quizModal" hidden role="dialog" aria-modal="true" aria-labelledby="quizTitle"><div class="sheet">
  <header><strong id="quizTitle">Quiz</strong><button class="btn" id="quizNew">New questions</button><button class="btn" id="quizClose">Close</button></header>
  <div class="scroll" id="quizBody"></div>
</div></div>

<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const KINDS=[["lecture","Lecture notes"],["homework","Homework"],["pcrq","PCRQ"],["ticket","Exit tickets"],["exam","Practice exams"]];
const WEEKS=[["Week 5","Week 5"],["Week 6","Week 6"],["Week 7","Week 7"],["Week 9","Week 9"],["Lectures 15–16 (not on goals sheet)","Lectures 15–16"]];
let DATA=null, mastery={}, store=null;
const WORDS=["Not rated","Just started","Shaky","Getting there","Solid","Mastered"];
const lv=id=>mastery[id]||0;
const ui={q:"",week:null,star:false,todo:false,open:null,tab:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tex=el=>{try{window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise([el]).catch(()=>{});}catch(e){}};
const gid=g=>String(g.n);
const its=g=>g.items.map(([id,note])=>({id,note,...DATA.items[id]}));

/* progress: per-person record in the artifact, else this browser */
try{mastery=JSON.parse(localStorage.getItem("m112mastery")||"{}")||{};}catch(e){}
function save(){try{localStorage.setItem("m112mastery",JSON.stringify(mastery));}catch(e){}
  if(store)store.set({mastery,updated:Date.now()}).catch(()=>{});}
async function connect(){try{
  if(!window.claude||!claude.use)return;
  const [db,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!u)return;
  const id=await u.id();if(!id)return;store=db.collection("data/users/"+id).doc("progress");
  const s=await store.get();if(s.exists){const v=s.data()||{};mastery=v.mastery||Object.fromEntries(Object.keys(v.known||{}).map(k=>[k,5]));render();}else if(Object.keys(mastery).length)save();
}catch(e){}}

function match(g){
  if(ui.week&&g.week!==ui.week)return false;
  if(ui.star&&!g.star)return false;
  if(ui.todo&&lv(gid(g))>=4)return false;
  if(ui.q){const hay=(g.text+" "+its(g).map(i=>i.src+" "+i.label+" "+(i.search||"")).join(" ")).toLowerCase();
    if(!ui.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w)))return false;}
  return true;
}
function itemHTML(i){
  const head=`<div class="ihead"><div class="ilabel">${esc(i.src)} <span>·</span> ${i.sec?esc(i.sec)+" <span>·</span> ":""}${esc(i.label)}</div>${i.pdf?`<button class="pdflink" data-pdf="${i.pdf}" data-page="${i.page}" data-title="${esc(i.src)}">Open PDF, page ${i.page}</button>`:""}</div>`;
  const note=i.note?`<p class="note">Covers part of this goal${i.note?": "+esc(i.note):""}.</p>`:"";
  let body;
  if(i.img){const w=Math.round(i.w*0.6);body=`<div class="paper"><img src="${i.img}" width="${w}" height="${Math.round(i.h*0.6)}" loading="lazy" alt="${esc(i.src+" "+i.label)}" style="--w:${w}px"></div>`;}
  else body=`<div class="paper tx"><p>${i.prompt}</p>${i.choices?`<ul class="choices ${i.style}">${i.choices.map(c=>`<li><span class="b"></span><span>${c}</span></li>`).join("")}</ul>`:`<p class="free">Written answer.</p>`}</div>`;
  return `<div class="item">${head}${note}${body}</div>`;
}
function goalHTML(g){
  const id=gid(g),open=ui.open===id,list=its(g),k=lv(id);
  let body="";
  if(open){
    const counts=Object.fromEntries(KINDS.map(([t])=>[t,list.filter(i=>i.kind===t).length]));
    let tab=ui.tab[id]; if(!tab||!counts[tab])tab=(KINDS.find(([t])=>counts[t])||KINDS[0])[0];
    body=`<div class="gbody"><div class="actions"><div class="stars" role="group" aria-label="Mastery level"><span class="lab">Mastery</span>${[1,2,3,4,5].map(n=>`<button data-rate="${n}" data-g="${id}" class="${n<=k?"on":""}" aria-label="${n} of 5: ${WORDS[n]}" aria-pressed="${n<=k}">★</button>`).join("")}<span class="word">${WORDS[k]}</span></div><button class="btn" data-quiz="${id}">Quiz me on this goal</button></div>
      <div class="tabs" role="tablist">${KINDS.map(([t,n])=>`<button class="tab" role="tab" data-tab="${t}" data-g="${id}" aria-selected="${t===tab}" ${counts[t]?"":"disabled"}>${n} (${counts[t]})</button>`).join("")}</div>
      <div class="items">${list.filter(i=>i.kind===tab).map(itemHTML).join("")}</div></div>`;
  }
  const label=typeof g.n==="number"?"Goal "+g.n:"Extra "+g.n;
  return `<article class="goal ${open?"open":""} lv${k}" id="g-${id}"><button class="ghead" data-open="${id}" aria-expanded="${open}"><span class="gn">${typeof g.n==="number"?g.n:g.n}</span><span class="gt">${esc(g.text)}<span class="gmeta">${g.star?`<span class="s">On a practice exam</span>`:""}<span>${list.length} sources</span>${k?`<span class="mini" title="${WORDS[k]}">${"★".repeat(k)}<i>${"★".repeat(5-k)}</i></span>`:""}</span></span><span class="chev" aria-hidden="true">›</span></button>${body}</article>`;
}
function render(){
  if(!DATA)return;
  $("#weeks").innerHTML=`<button class="pill" data-week="" aria-pressed="${!ui.week}">All weeks</button>`+WEEKS.map(([w,n])=>`<button class="pill" data-week="${esc(w)}" aria-pressed="${ui.week===w}">${n}</button>`).join("");
  const gs=DATA.goals.filter(match), total=DATA.goals.length, k=DATA.goals.filter(g=>lv(gid(g))>=4).length;
  $("#count").textContent=`${k} of ${total} goals at 4 ★ or more`;
  if(!gs.length){$("#list").innerHTML=`<p class="empty">No goals match. Clear the search or a filter.</p>`;return;}
  let h="",last=null;for(const g of gs){if(g.week!==last){h+=`<h2 class="week">${esc(g.week)}</h2>`;last=g.week;}h+=goalHTML(g);}
  $("#list").innerHTML=h; const o=ui.open&&document.getElementById("g-"+ui.open); if(o)tex(o);
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.open!==undefined){ui.open=ui.open===b.dataset.open?null:b.dataset.open;render();const el=document.getElementById("g-"+b.dataset.open);if(el&&ui.open)el.scrollIntoView({block:"nearest"});}
  else if(b.dataset.week!==undefined){ui.week=b.dataset.week||null;render();}
  else if(b.dataset.rate){const g=b.dataset.g,n=+b.dataset.rate;if(lv(g)===n)delete mastery[g];else mastery[g]=n;save();render();}
  else if(b.dataset.tab){ui.tab[b.dataset.g]=b.dataset.tab;render();}
  else if(b.dataset.pdf){openPdf(b.dataset.pdf,+b.dataset.page,b.dataset.title);}
  else if(b.dataset.quiz){openQuiz(b.dataset.quiz);}
});

$("#fStar").onclick=e=>{ui.star=!ui.star;e.currentTarget.setAttribute("aria-pressed",ui.star);render();};
$("#fTodo").onclick=e=>{ui.todo=!ui.todo;e.currentTarget.setAttribute("aria-pressed",ui.todo);render();};
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{ui.q=e.target.value.trim();render();},200);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#pdfModal").hidden=true;closeQuiz();}});

/* PDF viewer */
const cache={};let cur={};
async function openPdf(file,page,title){$("#pdfModal").hidden=false;$("#pdfTitle").textContent=title;$("#pdfMsg").textContent="Opening…";$("#pdfCanvas").hidden=true;
  try{if(!cache[file])cache[file]=await pdfjsLib.getDocument({data:await (await fetch(file)).arrayBuffer()}).promise;cur={doc:cache[file],page};await draw();}
  catch(err){$("#pdfMsg").textContent=`The PDF viewer didn't load. The passage is on page ${page} of ${title}.`;}}
async function draw(){const p=await cur.doc.getPage(cur.page),box=$("#pdfModal .scroll"),b=p.getViewport({scale:1}),d=window.devicePixelRatio||1;
  const vp=p.getViewport({scale:Math.min(box.clientWidth-28,820)/b.width*d}),c=$("#pdfCanvas");c.width=vp.width;c.height=vp.height;c.style.width=vp.width/d+"px";
  await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;c.hidden=false;$("#pdfMsg").textContent="";$("#pdfPage").textContent=`page ${cur.page} of ${cur.doc.numPages}`;box.scrollTop=0;}
$("#pdfPrev").onclick=()=>{if(cur.doc&&cur.page>1){cur.page--;draw();}};
$("#pdfNext").onclick=()=>{if(cur.doc&&cur.page<cur.doc.numPages){cur.page++;draw();}};
$("#pdfClose").onclick=()=>{$("#pdfModal").hidden=true;};
$("#pdfModal").onclick=e=>{if(e.target.id==="pdfModal")e.target.hidden=true;};

/* Quiz */
let qg=null,ab=null;
function closeQuiz(){$("#quizModal").hidden=true;if(ab)ab.abort();}
$("#quizClose").onclick=closeQuiz;$("#quizModal").onclick=e=>{if(e.target.id==="quizModal")closeQuiz();};
$("#quizNew").onclick=()=>runQuiz(true);
function openQuiz(id){qg=DATA.goals.find(g=>gid(g)===id);$("#quizTitle").textContent=(typeof qg.n==="number"?"Goal "+qg.n:"Extra "+qg.n)+" quiz";$("#quizModal").hidden=false;runQuiz();}
async function runQuiz(fresh){
  const g=qg,body=$("#quizBody");body.innerHTML=`<p class="muted">Writing four questions from the course material for this goal…</p>`;
  let sample=null;try{sample=window.claude&&claude.use?await claude.use("sample"):null;}catch(e){}
  if(!sample){cards(g);return;}
  if(ab)ab.abort();ab=new AbortController();
  const ctx=its(g).map(i=>`- [${i.src} · ${i.label}] ${(i.prompt||i.search||"").slice(0,500)}`).join("\n");
  const prompt=`You write practice questions for an undergraduate real-analysis course (Math 112, Midterm 2).
Learning goal: ${g.text}
Course material for this goal (match its notation and level; stay within it):
${ctx}

Write 4 multiple-choice questions testing this goal: a definition check, a true/false-style trap, a short computation or example, and one "which step of this argument is valid" question. Each has exactly 4 choices and one correct answer. Put math in LaTeX between single $ signs. Explanations: 1–2 sentences, naming the most relevant source label above.
Return only JSON: {"questions":[{"q":"...","choices":["...","...","...","..."],"answer":0,"explain":"...","source":"..."}]}`;
  try{
    const r=await sample.json(prompt,{signal:ab.signal,modelTier:"default",cache:fresh?false:undefined});const qs=(r&&r.questions)||[];if(!qs.length)throw 0;
    body.innerHTML=qs.map((q,n)=>`<div class="q" data-n="${n}"><p><b>${n+1}.</b> ${esc(q.q)}</p>${q.choices.map((c,j)=>`<button class="choice" data-n="${n}" data-j="${j}">${esc(c)}</button>`).join("")}<div class="explain" hidden>${esc(q.explain||"")}${q.source?` <i>(${esc(q.source)})</i>`:""}</div></div>`).join("")+`<p class="muted" id="score"></p>`;
    let right=0,done=0;body.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,box=body.querySelector(`.q[data-n="${n}"]`);if(box.dataset.d)return;box.dataset.d=1;done++;
      box.querySelectorAll(".choice").forEach(x=>{if(+x.dataset.j===qs[n].answer)x.classList.add("right");});if(+b.dataset.j===qs[n].answer)right++;else b.classList.add("wrong");
      box.querySelector(".explain").hidden=false;if(done===qs.length)$("#score").textContent=`Score: ${right} of ${qs.length}. Press “New questions” for another set.`;});
    tex(body);
  }catch(err){if(err&&err.name==="AbortError")return;
    if(err&&err.code==="rate_limited"){body.innerHTML=`<p class="muted">Too many quiz requests right now. Wait a minute, then press “New questions”.</p>`;return;}
    cards(g,"Practice questions from the course materials:");}
}
function cards(g,msg){const list=its(g).filter(i=>i.kind!=="lecture"),body=$("#quizBody");
  if(!list.length){body.innerHTML=`<p class="muted">This goal has no practice questions in the materials, only lecture passages.</p>`;return;}
  let k=0;const show=()=>{body.innerHTML=`<p class="muted">${esc(msg||"Practice questions from the course materials:")} ${k+1} of ${list.length}</p>${itemHTML(list[k])}<div class="row" style="margin-top:12px"><button class="btn" id="cPrev">‹ Previous</button><button class="btn primary" id="cNext">Next ›</button></div>`;
    $("#cPrev").onclick=()=>{k=(k-1+list.length)%list.length;show();};$("#cNext").onclick=()=>{k=(k+1)%list.length;show();};tex(body);};show();}

fetch("data.json").then(r=>r.json()).then(d=>{DATA=d;render();connect();}).catch(()=>{$("#list").innerHTML=`<p class="empty">The goals didn't load. Reload the page to try again.</p>`;});
</script>
