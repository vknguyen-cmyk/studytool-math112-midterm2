<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Math 112 Midterm 2 Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: sticky filter bar over a single column of goal cards; each card opens into source-grouped questions. Graph-paper header. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5b6672; --line:#dde2e8; --grid:#e6ebf1;
  --accent:#1d5d8f; --accent-soft:#e3eef7; --star:#b7791f; --star-soft:#fbf1dc;
  --good:#2f7d4f; --good-soft:#e2f2e8; --bad:#b4413a; --bad-soft:#f8e4e2;
  --lec:#1d5d8f; --hw:#6b4fa0; --pcrq:#a0582a; --ticket:#2f7d4f; --exam:#b4413a;
  --f-display:"IBM Plex Serif",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --ink:#e4e9ef; --muted:#97a3b0; --line:#2a3542; --grid:#1a222c;
  --accent:#74b0e0; --accent-soft:#1b3044; --star:#e2b25c; --star-soft:#352a14;
  --good:#6cc391; --good-soft:#173525; --bad:#ec8b83; --bad-soft:#3d1f1d;
  --lec:#74b0e0; --hw:#b39ce6; --pcrq:#e0a070; --ticket:#6cc391; --exam:#ec8b83; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --ink:#e4e9ef; --muted:#97a3b0; --line:#2a3542; --grid:#1a222c;
  --accent:#74b0e0; --accent-soft:#1b3044; --star:#e2b25c; --star-soft:#352a14;
  --good:#6cc391; --good-soft:#173525; --bad:#ec8b83; --bad-soft:#3d1f1d;
  --lec:#74b0e0; --hw:#b39ce6; --pcrq:#e0a070; --ticket:#6cc391; --exam:#ec8b83; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:26px 20px;display:grid;gap:14px}
h1{font:600 clamp(24px,4vw,32px)/1.15 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:65ch}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.wk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk .n{font:500 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wk .v{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good);width:0}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.filters .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 13px var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px var(--panel)}
.save{margin-left:auto;font:12px var(--f-mono);color:var(--muted)}
main .wrap{padding-block:18px 60px;display:grid;gap:12px}
.weekhead{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.goal{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.goal.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ghead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 16px;align-items:start}
.gnum{font:600 14px var(--f-mono);color:var(--accent);min-width:2.2em;padding-top:2px}
.gtext{margin:0;font-weight:500;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:500 11.5px var(--f-mono);border-radius:4px;padding:2px 7px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.star{background:var(--star-soft);color:var(--star);border-color:transparent}
.tag.weak{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.mast{background:var(--good-soft);color:var(--good);border-color:transparent}
.gside{display:grid;gap:8px;justify-items:end}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;font:500 13px var(--f-body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:focus-visible,.chip:focus-visible,.wk:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mcheck{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.mcheck input{accent-color:var(--good);width:16px;height:16px}
.prog{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.body{border-top:1px solid var(--line);padding:6px 16px 16px;display:grid;gap:14px}
.group h3{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px;display:flex;gap:8px;align-items:center}
.group h3 .dot{width:9px;height:9px;border-radius:2px}
.group .none{color:var(--muted);font-size:13.5px;margin:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-top:1px dashed var(--line);align-items:start}
.item:first-of-type{border-top:0}
.item input{margin-top:4px;accent-color:var(--good);width:15px;height:15px}
.lbl{font:500 12.5px var(--f-mono);color:var(--ink)}
.lbl b{font-weight:500;color:var(--muted)}
.qt{margin:3px 0 0;min-width:0;overflow-x:auto}
.item.done .qt{color:var(--muted)}
.flag{display:inline-block;font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:1px}
.flag.missed,.flag.recheck{background:var(--bad-soft);color:var(--bad)}
.flag.partial{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.fix{margin:6px 0 0;font-size:13.5px;background:var(--bad-soft);border-radius:6px;padding:7px 10px}
.open{font:500 12px var(--f-mono)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
/* modal */
#pdfModal{z-index:30}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:12px;width:min(860px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid var(--line)}
.sheet header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header strong{font:600 15px var(--f-display);margin-right:auto}
.sheet .scroll{overflow:auto;padding:14px;min-height:0}
#pdfCanvas{display:block;margin:0 auto;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.quizq{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.quizq p{margin:0 0 8px}
.choice{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{font-size:14px;color:var(--muted);margin-top:6px}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;min-height:150px;display:grid;gap:10px}
.muted{color:var(--muted)}
@media (max-width:640px){.ghead{grid-template-columns:auto 1fr}.gside{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.save{margin-left:0}.filters{position:static}.item{grid-template-columns:auto 1fr}.item .open{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <h1>Math 112 · Midterm 2 learning-goal map</h1>
  <p class="sub">Every learning goal with the lecture items and questions that cover it. Open any source at its page, tick off what you've practiced, and quiz yourself on a goal.</p>
  <div class="weeks" id="weeks"></div>
</div></header>

<div class="filters"><div class="wrap">
  <input id="q" class="search" type="search" placeholder="Search goals and questions (e.g. squeeze, polar, sup)" aria-label="Search">
  <button class="chip" id="fStar" aria-pressed="false">★ On practice exam</button>
  <button class="chip" id="fWeak" aria-pressed="false">Weak spots</button>
  <button class="chip" id="fTodo" aria-pressed="false">Not mastered</button>
  <span id="srcChips"></span>
  <span class="save" id="save">Progress: this browser</span>
</div></div>

<main><div class="wrap" id="list"><p class="empty">Loading goals…</p></div></main>

<div class="modal" id="pdfModal" hidden role="dialog" aria-modal="true" aria-labelledby="pdfTitle"><div class="sheet">
  <header><strong id="pdfTitle"></strong>
    <button class="btn" id="pdfPrev">‹ Prev</button><span class="prog" id="pdfPage"></span><button class="btn" id="pdfNext">Next ›</button>
    <button class="btn" id="pdfZoom">Zoom</button><button class="btn" id="pdfClose">Close</button></header>
  <div class="scroll"><p class="muted" id="pdfMsg"></p><canvas id="pdfCanvas"></canvas></div>
</div></div>

<div class="modal" id="quizModal" hidden role="dialog" aria-modal="true" aria-labelledby="quizTitle"><div class="sheet">
  <header><strong id="quizTitle">Quiz</strong><button class="btn" id="quizNew">New questions</button><button class="btn" id="quizClose">Close</button></header>
  <div class="scroll" id="quizBody"></div>
</div></div>

<script>
window.MathJax={tex:{inlineMath:[["$","$"]]},svg:{fontCache:"global"},startup:{typeset:false}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const SHORT={lecture:"lecture",homework:"homework",pcrq:"PCRQ",ticket:"exit ticket",exam:"practice exam"};
const SRC=[["lecture","Lecture notes","--lec"],["homework","Homework","--hw"],["pcrq","PCRQ","--pcrq"],["ticket","Exit tickets","--ticket"],["exam","Practice exams","--exam"]];
let DATA=null, state={mastered:{},done:{}}, store=null, db=null;
const ui={q:"",star:false,weak:false,todo:false,week:null,src:new Set(SRC.map(s=>s[0])),open:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const typeset=el=>{try{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{});}catch(e){}};
const gid=g=>String(g.n);

/* ---------- persistence: db per-user doc, falling back to localStorage ---------- */
function loadLocal(){try{const s=JSON.parse(localStorage.getItem("m112map")||"null");if(s&&s.mastered)state=s;}catch(e){}}
function saveLocal(){try{localStorage.setItem("m112map",JSON.stringify(state));}catch(e){}}
let saveT=null;
function persist(){saveLocal();if(!store)return;clearTimeout(saveT);saveT=setTimeout(()=>{store.set({mastered:state.mastered,done:state.done,updated:Date.now()}).then(()=>{$("#save").textContent="Progress saved to your account";}).catch(()=>{$("#save").textContent="Progress: this browser only";});},600);}
async function connectStore(){
  try{
    if(!window.claude||!claude.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return; const id=await u.id(); if(!id)return;
    db=d; store=d.collection("data/users/"+id).doc("progress");
    const snap=await store.get();
    if(snap.exists){const v=snap.data()||{};state={mastered:v.mastered||{},done:v.done||{}};saveLocal();render();}
    else if(Object.keys(state.done).length||Object.keys(state.mastered).length){persist();}
    $("#save").textContent="Progress saved to your account";
  }catch(e){$("#save").textContent="Progress: this browser only";}
}

/* ---------- derived ---------- */
function itemsOf(g){return g.items.map(([id,note])=>({id,note,...DATA.items[id]}));}
function isWeak(g){return itemsOf(g).some(i=>/missed|recheck/.test(i.note));}
function gProg(g){const its=itemsOf(g).filter(i=>i.kind!=="lecture");const d=its.filter(i=>state.done[gid(g)+"|"+i.id]).length;return [d,its.length];}
function matches(g){
  if(ui.week&&g.week!==ui.week)return false;
  if(ui.star&&!g.star)return false;
  if(ui.weak&&!isWeak(g))return false;
  if(ui.todo&&state.mastered[gid(g)])return false;
  if(ui.q){const q=ui.q.toLowerCase();const hay=(g.text+" "+itemsOf(g).map(i=>i.src+" "+i.label+" "+i.text).join(" ")).toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false;}
  return true;
}

/* ---------- render ---------- */
function renderWeeks(){
  const weeks=[...new Set(DATA.goals.map(g=>g.week))];
  $("#weeks").innerHTML=weeks.map(w=>{const gs=DATA.goals.filter(g=>g.week===w);const m=gs.filter(g=>state.mastered[gid(g)]).length;
    const short=w.startsWith("Lectures")?"Lectures 15–16":w;
    return `<button class="wk" data-week="${esc(w)}" aria-pressed="${ui.week===w}"><span class="n">${esc(short)}</span><span class="v">${m} / ${gs.length} mastered</span><span class="bar"><i style="width:${gs.length?100*m/gs.length:0}%"></i></span></button>`;}).join("");
}
function renderSrcChips(){
  $("#srcChips").innerHTML=SRC.map(([k,n,c])=>`<button class="chip" data-src="${k}" aria-pressed="${ui.src.has(k)}"><span class="dot" style="background:var(${c})"></span>${n}</button>`).join(" ");
}
function itemHTML(g,i){
  const key=gid(g)+"|"+i.id, done=!!state.done[key];
  const flags=(i.note||"").split("·").map(s=>s.trim()).filter(Boolean).map(n=>{
    const cls=n.startsWith("missed")?"missed":n.startsWith("recheck")?"recheck":"partial";
    const txt=cls==="missed"?"✗ you missed this":cls==="recheck"?"✗ recheck your answer":n.replace(/^partial:?\s*/,"partial"+(n.length>8?": ":""));
    return `<span class="flag ${cls}">${esc(txt)}</span>`;}).join("");
  const check=i.kind==="lecture"?`<span title="Lecture item" aria-hidden="true" style="width:15px"></span>`:`<input type="checkbox" data-done="${esc(key)}" ${done?"checked":""} aria-label="Mark ${esc(i.src+" "+i.label)} as practiced">`;
  const label=i.kind==="ticket"?esc(i.label):`${esc(i.src)} <b>·</b> ${esc(i.label)}`;
  return `<div class="item ${done?"done":""}">${check}<div style="min-width:0"><div class="lbl">${label}${flags}</div><p class="qt">${md(i.text)}</p>${i.recheck?`<p class="fix"><b>Fix:</b> ${esc(i.recheck)}</p>`:""}</div>
    <button class="btn open" data-pdf="${esc(i.file)}" data-page="${i.page}" data-title="${esc(i.kind==="ticket"?"Exit Tickets":i.src)}">p.${i.page} ↗</button></div>`;
}
function goalHTML(g){
  const id=gid(g), open=ui.open.has(id), [d,t]=gProg(g), m=!!state.mastered[id];
  const its=itemsOf(g);
  const counts=SRC.map(([k])=>[SHORT[k],its.filter(i=>i.kind===k).length]).filter(x=>x[1]).map(([n,c])=>`<span class="tag">${c} ${esc(n)}</span>`).join("");
  let body="";
  if(open){body=`<div class="body">`+SRC.filter(([k])=>ui.src.has(k)).map(([k,n,c])=>{const list=its.filter(i=>i.kind===k);
      return `<div class="group"><h3><span class="dot" style="background:var(${c})"></span>${n} (${list.length})</h3>${list.length?list.map(i=>itemHTML(g,i)).join(""):`<p class="none">None found for this goal.</p>`}</div>`;}).join("")+`</div>`;}
  return `<article class="goal ${m?"done":""}" data-goal="${esc(id)}">
   <div class="ghead"><span class="gnum">${typeof g.n==="number"?"G"+g.n:"X-"+g.n}</span>
    <div style="min-width:0"><p class="gtext">${md(g.text)}</p><div class="meta">${g.star?`<span class="tag star">★ practice exam</span>`:""}${isWeak(g)?`<span class="tag weak">weak spot</span>`:""}${m?`<span class="tag mast">mastered</span>`:""}${counts}</div></div>
    <div class="gside"><button class="btn ${open?"":"primary"}" data-toggle="${esc(id)}" aria-expanded="${open}">${open?"Hide":"Show"} ${its.length} items</button>
     <button class="btn" data-quiz="${esc(id)}">Quiz me</button>
     <label class="mcheck"><input type="checkbox" data-master="${esc(id)}" ${m?"checked":""}> Mastered</label>
     <span class="prog">${d}/${t} practiced</span></div></div>${body}</article>`;
}
function render(){
  if(!DATA)return;
  renderWeeks();
  const gs=DATA.goals.filter(matches);
  if(!gs.length){$("#list").innerHTML=`<p class="empty">No goals match these filters. Clear the search or a filter to see more.</p>`;return;}
  let html="",last=null;
  for(const g of gs){if(g.week!==last){html+=`<h2 class="weekhead">${esc(g.week)}</h2>`;last=g.week;}html+=goalHTML(g);}
  $("#list").innerHTML=html; typeset($("#list"));
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.toggle){const id=t.dataset.toggle;ui.open.has(id)?ui.open.delete(id):ui.open.add(id);render();}
  else if(t.dataset.week!==undefined&&t.classList.contains("wk")){ui.week=ui.week===t.dataset.week?null:t.dataset.week;render();}
  else if(t.dataset.src){const k=t.dataset.src;ui.src.has(k)?ui.src.delete(k):ui.src.add(k);renderSrcChips();render();}
  else if(t.dataset.pdf){openPdf(t.dataset.pdf,+t.dataset.page,t.dataset.title);}
  else if(t.dataset.quiz){openQuiz(t.dataset.quiz);}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.done){t.checked?state.done[t.dataset.done]=1:delete state.done[t.dataset.done];persist();render();}
  if(t.dataset.master){t.checked?state.mastered[t.dataset.master]=1:delete state.mastered[t.dataset.master];persist();render();}
});
for(const [id,key] of [["#fStar","star"],["#fWeak","weak"],["#fTodo","todo"]])$(id).addEventListener("click",e=>{ui[key]=!ui[key];e.currentTarget.setAttribute("aria-pressed",ui[key]);render();});
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{ui.q=e.target.value.trim();if(ui.q)DATA.goals.forEach(g=>{if(matches(g))ui.open.add(gid(g));});render();},200);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#pdfModal").hidden=true;$("#quizModal").hidden=true;}});

/* ---------- PDF viewer ---------- */
const pdfCache={};let cur={doc:null,page:1,zoom:false,title:""};
async function openPdf(file,page,title){
  const m=$("#pdfModal");m.hidden=false;$("#pdfTitle").textContent=title;$("#pdfMsg").textContent="Opening…";$("#pdfCanvas").hidden=true;
  try{
    if(!window.pdfjsLib)throw new Error("viewer");
    if(!pdfCache[file]){const buf=await (await fetch(file)).arrayBuffer();pdfCache[file]=await pdfjsLib.getDocument({data:buf}).promise;}
    cur={doc:pdfCache[file],page,zoom:cur.zoom,title};await drawPage();
  }catch(err){$("#pdfMsg").textContent="This page couldn't be displayed here. The cited page is p."+page+" of "+title+".";}
}
async function drawPage(){
  const p=await cur.doc.getPage(cur.page);const box=$("#pdfModal .scroll");
  const base=p.getViewport({scale:1});const w=Math.min(box.clientWidth-28,820)*(cur.zoom?1.8:1);
  const scale=w/base.width, dpr=window.devicePixelRatio||1, vp=p.getViewport({scale:scale*dpr});
  const c=$("#pdfCanvas");c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+"px";c.style.maxWidth=cur.zoom?"none":"100%";
  await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  c.hidden=false;$("#pdfMsg").textContent="";$("#pdfPage").textContent=`p. ${cur.page} / ${cur.doc.numPages}`;box.scrollTop=0;
}
$("#pdfPrev").onclick=()=>{if(cur.doc&&cur.page>1){cur.page--;drawPage();}};
$("#pdfNext").onclick=()=>{if(cur.doc&&cur.page<cur.doc.numPages){cur.page++;drawPage();}};
$("#pdfZoom").onclick=()=>{cur.zoom=!cur.zoom;$("#pdfZoom").textContent=cur.zoom?"Fit":"Zoom";if(cur.doc)drawPage();};
$("#pdfClose").onclick=()=>{$("#pdfModal").hidden=true;};
$("#pdfModal").addEventListener("click",e=>{if(e.target.id==="pdfModal")e.target.hidden=true;});

/* ---------- Quiz ---------- */
let quizGoal=null,quizAbort=null;
function goalById(id){return DATA.goals.find(g=>gid(g)===id);}
async function openQuiz(id){quizGoal=goalById(id);$("#quizModal").hidden=false;$("#quizTitle").textContent=(typeof quizGoal.n==="number"?"Goal "+quizGoal.n:"Topic "+quizGoal.n)+" quiz";runQuiz();}
$("#quizNew").onclick=()=>runQuiz(true);
$("#quizClose").onclick=()=>{$("#quizModal").hidden=true;if(quizAbort)quizAbort.abort();};
$("#quizModal").addEventListener("click",e=>{if(e.target.id==="quizModal"){e.target.hidden=true;if(quizAbort)quizAbort.abort();}});
async function runQuiz(fresh){
  const g=quizGoal,body=$("#quizBody");
  body.innerHTML=`<p class="muted">Writing 4 questions from your course material for this goal…</p>`;
  let sample=null;try{sample=window.claude&&claude.use?await claude.use("sample"):null;}catch(e){}
  if(!sample){flashcards(g);return;}
  if(quizAbort)quizAbort.abort();quizAbort=new AbortController();
  const ctx=itemsOf(g).map(i=>`- [${i.src} · ${i.label}] ${i.text}`).join("\n");
  const prompt=`You write practice questions for a university real-analysis course (Math 112, Midterm 2).
Learning goal: ${g.text}
Course material linked to this goal (use its notation and level; do not go beyond it):
${ctx}

Write 4 multiple-choice questions that test this goal: mix definitions, true/false-style traps, quick computations, and one "which proof step is valid" question. Each has exactly 4 choices and one correct answer. Use LaTeX between single $ signs for math. Keep each explanation to 1-2 sentences and cite the most relevant source label from the list.
Return only JSON: {"questions":[{"q":"...","choices":["...","...","...","..."],"answer":0,"explain":"...","source":"Lecture 12 · §3 de Moivre's formula"}]}`;
  try{
    const res=await sample.json(prompt,{signal:quizAbort.signal,modelTier:"default",cache:fresh?false:undefined});
    const qs=(res&&res.questions)||[];if(!qs.length)throw new Error("empty");
    body.innerHTML=qs.map((q,qi)=>`<div class="quizq" data-qi="${qi}"><p><b>${qi+1}.</b> ${md(q.q)}</p>${q.choices.map((c,ci)=>`<button class="choice" data-qi="${qi}" data-ci="${ci}">${md(c)}</button>`).join("")}<div class="explain" hidden>${md(q.explain||"")}${q.source?` <span class="tag">${esc(q.source)}</span>`:""}</div></div>`).join("")+`<p class="muted" id="score"></p>`;
    let right=0,answered=0;
    body.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const qi=+b.dataset.qi,box=body.querySelector(`.quizq[data-qi="${qi}"]`);if(box.dataset.done)return;box.dataset.done=1;answered++;
      const ans=qs[qi].answer;box.querySelectorAll(".choice").forEach(x=>{if(+x.dataset.ci===ans)x.classList.add("right");});if(+b.dataset.ci===ans)right++;else b.classList.add("wrong");
      box.querySelector(".explain").hidden=false;if(answered===qs.length)$("#score").textContent=`Score: ${right} / ${qs.length}. Press “New questions” for another set.`;});
    typeset(body);
  }catch(err){
    if(err&&err.name==="AbortError")return;
    if(err&&err.code==="not_granted"){flashcards(g,"Quiz generation wasn't allowed, so here are flashcards from your own materials instead.");return;}
    if(err&&err.code==="rate_limited"){body.innerHTML=`<p class="muted">Too many quiz requests right now. Wait a minute, then press “New questions”.</p>`;return;}
    flashcards(g,"Couldn't write a quiz just now, so here are flashcards from your own materials.");
  }
}
function flashcards(g,msg){
  const cards=itemsOf(g).filter(i=>i.kind!=="lecture");const body=$("#quizBody");
  if(!cards.length){body.innerHTML=`<p class="muted">${esc(msg||"")} This goal has no practice questions in your files, only lecture items. Open them from the goal card.</p>`;return;}
  let k=0;
  const show=()=>{const c=cards[k];body.innerHTML=`${msg?`<p class="muted">${esc(msg)}</p>`:""}<div class="card"><div class="lbl">${esc(c.kind==="ticket"?c.label:c.src+" · "+c.label)} — card ${k+1} of ${cards.length}</div><p class="qt">${md(c.text)}</p><p class="muted">Work it out, then open the source to check.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="fcPrev">‹ Back</button><button class="btn" data-pdf="${esc(c.file)}" data-page="${c.page}" data-title="${esc(c.src)}">Open p.${c.page}</button><button class="btn primary" id="fcNext">Next ›</button></div></div>`;
    $("#fcPrev").onclick=()=>{k=(k-1+cards.length)%cards.length;show();};$("#fcNext").onclick=()=>{k=(k+1)%cards.length;show();};typeset(body);};
  show();
}

/* ---------- boot ---------- */
loadLocal();renderSrcChips();
fetch("data.json").then(r=>r.json()).then(d=>{DATA=d;render();connectStore();}).catch(()=>{$("#list").innerHTML=`<p class="empty">The goal data didn't load. Reload the page to try again.</p>`;});
</script>
